name: uyku
description: "Uyku — sakin bir uyku ve toparlanma takipçisi."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  audio_session: ^0.2.4
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_timezone: ^5.1.0
  go_router: ^17.2.3
  intl: ^0.20.2
  just_audio: ^0.10.6
  shared_preferences: ^2.5.5
  timezone: ^0.11.1

dev_dependencies:
  very_good_analysis: ^11.0.0

# path_provider_android 2.3+ jni'ye geçti ve NDK 28.2 indirtiyor; 2.2.x NDK'sız.
dependency_overrides:
  path_provider_android: ">=2.2.0 <2.3.0"

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
        - asset: assets/fonts/Nunito-900.ttf
          weight: 900
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
          weight: 400
        - asset: assets/fonts/Figtree-500.ttf
          weight: 500
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree-700.ttf
          weight: 700
